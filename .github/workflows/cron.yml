name: Scheduled Cron Jobs

on:
  schedule:
    # Runs every hour at minute 0
    - cron: '0 * * * *'
  # Allows manual triggering from GitHub Actions tab
  workflow_dispatch:
    inputs:
      target_endpoint:
        description: 'Endpoint to trigger (e.g. /api/cron/daily or /api/cron/whatsapp-retry)'
        required: true
        default: '/api/cron/daily'

jobs:
  trigger-cron:
    name: Trigger Cron Jobs
    runs-on: ubuntu-latest
    steps:
      - name: Send Cron Request
        env:
          SITE_URL: ${{ secrets.SITE_URL || 'https://sherohq.com' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ENDPOINT: ${{ github.event.inputs.target_endpoint || '/api/cron/daily' }}
        run: |
          # Strip trailing slash from base URL
          CLEAN_BASE_URL="${SITE_URL%/}"
          TARGET_URL="${CLEAN_BASE_URL}${ENDPOINT}"
          
          echo "Triggering Cron Endpoint: $TARGET_URL"

          # Perform HTTP GET request with Authorization header
          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "$TARGET_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "User-Agent: GitHub-Actions-Cron/1.0" \
            -H "Content-Type: application/json")

          # Extract HTTP Status code and body
          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n 1)

          echo "Response Status Code: $HTTP_STATUS"
          echo "Response Body:"
          echo "$HTTP_BODY"

          # Validate HTTP status code
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Cron executed successfully."
            exit 0
          else
            echo "Cron failed with HTTP Status: $HTTP_STATUS"
            exit 1
          fi
