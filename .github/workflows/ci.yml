name: CI

on:
  push:
    branches: [main, rebuild]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --immutable
      - name: Design tokens are up to date
        run: yarn tokens && git diff --exit-code src/styles/tokens.css
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
