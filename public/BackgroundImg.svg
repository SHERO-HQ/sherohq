<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blob-blur" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceGraphic" stdDeviation="50" />
    </filter>
    <filter id="blob-noise" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="2" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0 0.1 0" />
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="soft-light" />
    </filter>
    <radialGradient id="blob-gradient" cx="50%" cy="50%" r="50%" fx="77%" fy="36%">
      <stop offset="0%" stop-color="#444cf7" />
      <stop offset="100%" stop-color="rgba(194,68,247,0.2)" />
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="currentColor" />
  <g filter="url(#blob-noise)">
    <g filter="url(#blob-blur)">
      <path
        fill="url(#blob-gradient)"
        d="M406 333q-60 83-165.5 99.5t-167-83q-61.5-99.5 14-175T268.5 67Q374 35 420 142.5T406 333Z"
        transform="translate(28.649 457.773) scale(2)"
      />
    </g>
  </g>
</svg>
