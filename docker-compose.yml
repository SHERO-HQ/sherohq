# Local database for development: `docker compose up -d`.
# Postgres 16, the version Supabase runs.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shero
      POSTGRES_PASSWORD: shero
      POSTGRES_DB: shero
    ports:
      - "5432:5432"
    volumes:
      - shero-db:/var/lib/postgresql/data

volumes:
  shero-db:
